<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reclamos · Belgrano Home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f1a2a'/><text x='50' y='68' text-anchor='middle' font-size='46' font-weight='700' fill='%23fff' font-family='sans-serif'>BH</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#2f6fed;--blue-d:#1e5fce;--blue-soft:#e7effe;
  --ink:#0f1a2a;--ink2:#2a3648;--muted:#5b6675;--muted2:#8a94a3;--faint:#9aa4b2;
  --line:#e6eaf1;--line2:#eef1f5;--line3:#f0f2f6;--bg:#f1f4f8;--card:#fff;
  --green:#15803d;--green-bg:#e6f6ec;--amber:#b45309;--amber-bg:#fdf3e2;
  --red:#c0362c;--red-bg:#fbeaea;
  --shadow:0 1px 2px rgba(15,26,42,.04),0 1px 3px rgba(15,26,42,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ---------- Shell / Sidebar ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:240px;background:#0f2233;color:#fff;display:none;flex-direction:column;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;z-index:40}
.shell.authed .sidebar{display:flex}
.sidebar .brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.sidebar .brand h1{font-size:15px;margin:0;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1.1}
.sidebar .brand .sub{color:rgba(255,255,255,.5);font-size:11.5px;margin-top:2px}
.logo-tile{width:36px;height:36px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:3px;padding:6px 12px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:none;background:transparent;color:rgba(255,255,255,.72);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;border-radius:9px;text-align:left;width:100%;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:rgba(47,111,237,.18);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.nav button svg{flex-shrink:0}
.side-user{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:13px;min-width:0}
.side-user .avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.side-user .su-name{font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .su-role{color:rgba(255,255,255,.5);font-size:11.5px}

.main{flex:1;margin-left:0;display:flex;flex-direction:column;min-width:0}
.shell.authed .main{margin-left:240px}
.topbar{height:64px;background:var(--card);border-bottom:1px solid var(--line);display:none;align-items:center;justify-content:space-between;gap:14px;padding:0 26px;position:sticky;top:0;z-index:30}
.shell.authed .topbar{display:flex}
.topbar-l{display:flex;align-items:center;gap:14px;min-width:0}
.hamburger{display:none;border:none;background:transparent;cursor:pointer;color:var(--ink);padding:6px;border-radius:8px}
.page-title{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em;line-height:1.1}
.page-date{font-size:12.5px;color:var(--muted2);margin-top:1px}
.topbar-r{display:flex;align-items:center;gap:9px;flex-shrink:0}
.backdrop{display:none;position:fixed;inset:0;background:rgba(15,26,42,.5);z-index:35}
.backdrop.show{display:block}

.container{max-width:1120px;margin:0 auto;width:100%;padding:26px 26px 72px}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{margin:0 0 16px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.card h3{margin:0 0 14px;font-size:13px;color:var(--muted2);font-weight:600;letter-spacing:.01em}

/* ---------- Stats ---------- */
.grid{display:grid;gap:14px}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.stat .label{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .label .dot{width:7px;height:7px;border-radius:50%;background:#c4cdd9;flex-shrink:0}
.stat .value{font-size:31px;font-weight:700;margin-top:9px;color:var(--ink);letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}
.stat .value small{font-size:14px;font-weight:600;color:var(--muted2);letter-spacing:0}
.stat.s-abierto .value{color:var(--red)}.stat.s-abierto::before{background:var(--red)}.stat.s-abierto .dot{background:var(--red)}
.stat.s-espera .value{color:var(--amber)}.stat.s-espera::before{background:var(--amber)}.stat.s-espera .dot{background:var(--amber)}
.stat.s-prod .value{color:var(--blue)}.stat.s-prod::before{background:var(--blue)}.stat.s-prod .dot{background:var(--blue)}
.stat.s-cerrado .value{color:var(--green)}.stat.s-cerrado::before{background:var(--green)}.stat.s-cerrado .dot{background:var(--green)}
.stat.clickable{cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .08s}
.stat.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(15,26,42,.22);border-color:#d3dbe6}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;align-items:end}
label.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:var(--ink2)}
label.field .hint{font-weight:400;color:var(--muted2);font-size:12px}
input,select,textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
input::placeholder,textarea::placeholder{color:#aab3c0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,237,.14)}

.sub-h{font-size:12px;font-weight:700;color:var(--blue-d);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 2px}

/* ---------- Accordion ---------- */
.acc{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:#fff}
.acc>summary{cursor:pointer;padding:14px 16px;font-weight:600;font-size:14.5px;color:var(--ink);list-style:none;display:flex;align-items:center;gap:10px;background:#fafbfd;user-select:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:1.6px solid var(--muted2);border-bottom:1.6px solid var(--muted2);transform:rotate(-45deg);transition:transform .2s;margin-right:3px}
.acc[open]>summary::after{transform:rotate(45deg)}
.acc[open]>summary{border-bottom:1px solid var(--line)}
.acc .acc-body{padding:18px 16px}
.acc .ico{color:var(--muted2);display:inline-flex}

/* ---------- Buttons ---------- */
.btn{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:9px;padding:10px 17px;border:1px solid transparent;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink2)}.btn-ghost:hover{background:#f6f8fb;border-color:#d3dbe6}
.btn-danger{background:#fff;border-color:#f3cfcb;color:var(--red)}.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:7px 13px;font-size:13px}
.row-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
#topActions{flex-shrink:0;flex-wrap:nowrap}
#topActions .user-pill{max-width:240px;overflow:hidden;text-overflow:ellipsis}
.error-msg{color:var(--red);font-size:13px;font-weight:600;margin-top:10px}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
thead tr{background:#f8fafc}
th{padding:12px 14px;text-align:left;font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--ink2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfd}

/* ---------- Badge ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.e-abierto{background:var(--red-bg);color:#b42318}
.e-espera{background:var(--amber-bg);color:var(--amber)}
.e-prod{background:var(--blue-soft);color:#1d4ed8}
.e-cerrado{background:var(--green-bg);color:var(--green)}

.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}.filters label.field{min-width:160px}
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:14.5px}
.empty .big{display:inline-flex;margin-bottom:14px;color:#c4cdd9}
.muted{color:var(--muted2);font-size:13px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.section-title h2{margin:0}

/* ---------- Bars ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bars-scroll{max-height:352px;overflow-y:auto;padding-right:8px;margin-right:-4px}
.bars-scroll::-webkit-scrollbar{width:8px}
.bars-scroll::-webkit-scrollbar-thumb{background:#d3dbe6;border-radius:4px}
.bars-scroll::-webkit-scrollbar-thumb:hover{background:#c0cad8}
.bars-scroll::-webkit-scrollbar-track{background:transparent}
.bar-row{display:grid;grid-template-columns:135px 1fr 42px;gap:12px;align-items:center;font-size:13px;color:var(--ink2)}
.bar-track{background:#eef1f6;border-radius:6px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-row .n{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bar-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.charts-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.txt-clip{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.compact th{padding:10px 14px}
.compact td{padding:11px 14px;font-size:13.5px}
.compact tbody tr{line-height:1.3}

.act-btn{cursor:pointer;border:none;background:transparent;padding:5px;border-radius:7px;line-height:0;color:var(--muted2);display:inline-flex;transition:background .12s,color .12s}
.act-btn:hover{background:#eef1f6;color:var(--ink)}
.act-btn.danger:hover{background:var(--red-bg);color:var(--red)}

.cfg-list{display:flex;flex-direction:column;gap:7px}
.cfg-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;background:#f8fafc;border:1px solid var(--line2);border-radius:9px;font-size:14px;color:var(--ink2)}
.cfg-item .cfg-acts{display:flex;gap:2px;flex:0 0 auto}

/* ---------- Login ---------- */
.login-wrap{max-width:400px;margin:9vh auto;padding:16px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -28px rgba(15,26,42,.35);padding:32px 28px}
.login-card .logo-tile{width:48px;height:48px;border-radius:12px;font-size:18px;margin:0 auto}
.login-card h2{text-align:center;margin:16px 0 4px;font-size:20px;font-weight:700}
.login-card p{text-align:center;color:var(--muted2);font-size:13px;margin:0 0 22px}
.login-card label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--ink2)}
.login-card input{margin-bottom:15px}
.login-card .btn{width:100%;justify-content:center}
.user-pill{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.user-pill .avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}

/* ---------- Banner ---------- */
.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;padding:11px 17px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 12px 30px -8px rgba(15,26,42,.5);z-index:60;max-width:90%;display:flex;align-items:center;gap:9px}
.banner.err{background:#b42318}
.banner.ok{background:var(--green)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Comprobante ---------- */
#compOverlay{position:fixed;inset:0;background:rgba(15,26,42,.55);z-index:100;overflow:auto;padding:20px;display:none}
.comp-sheet{max-width:800px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.comp-toolbar{display:flex;gap:9px;justify-content:flex-end;padding:13px;position:sticky;top:0;background:#f8fafc;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.doc{padding:30px 36px;color:var(--ink)}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--blue);padding-bottom:12px}
.doc-brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:700;color:var(--ink);line-height:1}
.doc-brand .logo-tile{width:38px;height:38px;border-radius:9px;font-size:14px}
.doc-brand small{display:block;font-size:10px;color:var(--muted2);font-weight:600;letter-spacing:.22em;margin-top:3px}
.doc-note{font-size:11px;color:var(--muted2);text-align:right;line-height:1.5}
.doc-title{text-align:center;letter-spacing:.32em;margin:20px 0 3px;font-size:19px;font-weight:700;color:var(--ink)}
.doc-sub{text-align:center;color:var(--muted2);font-size:13px;margin:0 0 18px}
.doc-grid2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.doc-cell{padding:9px 13px;border-bottom:1px solid var(--line2)}
.doc-cell:nth-child(odd){border-right:1px solid var(--line2)}
.doc-cell .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);font-weight:600}
.doc-cell .v{font-size:15px;font-weight:600;min-height:20px;color:var(--ink)}
.doc-sec{margin-top:18px}
.doc-sec h3{background:var(--blue-soft);color:#1d4ed8;padding:7px 13px;border-radius:7px;font-size:11px;letter-spacing:.1em;margin:0 0 9px;font-weight:700}
.doc-box{border:1px solid var(--line);border-radius:9px;padding:11px 13px;min-height:44px;font-size:14px;white-space:pre-wrap;color:var(--ink2)}
.doc-firmas{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:56px}
.doc-firma{border-top:1px solid #94a3b8;text-align:center;padding-top:7px;font-size:12px;color:var(--muted2)}

@media print{
  body *{visibility:hidden}
  #compOverlay,#compOverlay *{visibility:visible}
  #compOverlay{position:absolute;inset:0;background:#fff;padding:0;display:block}
  .comp-sheet{box-shadow:none;max-width:none;margin:0;border-radius:0}
  .comp-toolbar{display:none!important}
  @page{size:A4;margin:14mm}
}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .22s ease;width:264px}
  .sidebar.open{transform:none;box-shadow:0 0 50px rgba(0,0,0,.45)}
  .shell.authed .main{margin-left:0}
  .hamburger{display:inline-flex}
}
@media(max-width:600px){
  .topbar{padding:0 16px;height:58px}
  .topbar-r .lbl{display:none}
  .container{padding:20px 14px 60px}
  .card{padding:16px}
  .stat .value{font-size:26px}
  .bar-row{grid-template-columns:105px 1fr 36px}
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo-tile">BH</div>
      <div><h1>Belgrano Home</h1><div class="sub">Envíos · Reclamos</div></div>
    </div>
    <nav class="nav" id="tabs"></nav>
    <div class="side-user" id="sideUser"></div>
  </aside>
  <div class="main">
    <header class="topbar" id="topbar">
      <div class="topbar-l">
        <button class="hamburger" id="btnMenu" aria-label="Menú"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="6" x2="18" y2="6"></line><line x1="4" y1="11" x2="18" y2="11"></line><line x1="4" y1="16" x2="18" y2="16"></line></svg></button>
        <div><div class="page-title" id="pageTitle">Tablero</div><div class="page-date" id="pageDate"></div></div>
      </div>
      <div class="topbar-r" id="topActions">
        <button class="btn btn-primary btn-sm" id="btnNuevo"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="9" y1="4" x2="9" y2="14"></line><line x1="4" y1="9" x2="14" y2="9"></line></svg><span class="lbl">Nuevo reclamo</span></button>
        <button class="btn btn-ghost btn-sm" id="btnBackup">Backup</button>
        <button class="btn btn-ghost btn-sm" id="btnImport">Importar</button>
        <button class="btn btn-ghost btn-sm" id="btnLogout">Salir</button>
        <input type="file" id="fileImport" accept="application/json" hidden />
      </div>
    </header>
    <main class="container" id="view"></main>
  </div>
</div>

<script>
"use strict";
const K_REC='rc_reclamos_v1';
// Estados del ciclo del reclamo
const ESTADOS=['ABIERTO','EN ESPERA','EN PRODUCCIÓN','CERRADO'];
function estClass(e){return {'ABIERTO':'e-abierto','EN ESPERA':'e-espera','EN PRODUCCIÓN':'e-prod','CERRADO':'e-cerrado'}[e]||'e-abierto'}
const RESPONSABLES=['1 FLETE','2 PROVEEDOR','3 FABRICA','4 CARPINTERO','5 NO TIENE SOLUCION','6 ASESORÍA'];
const TIPOS_SOLUCION=['1- TRAE EL MUEBLE A FABRICA','2- VA EL FLETE A DOMICILIO','3- VA CARPINTERO A DOMICILIO','4- REINTEGRAMOS PARTE DEL DINERO','5- RECOMENDACIONES DE USO','6- CAMBIO DEL MUEBLE EN FABRICA','7- CAMBIO DEL MUEBLE EN DOMICILIO','8- OTROS'];
const COSTOS=['SIN COSTO','COSTO BAJO','COSTO MEDIO','COSTO ALTO','DEVOLUCION'];
// Sugerencias (se pueden escribir otras igual)
const FLETES=['1 IVAN','2 FABIAN','3 JUAN','5 EXPRESO','7 MARCOS','8 RETIRO','9 PEDRO (jony)','10 LALO','11 MAURO'];
const PROVEEDORES=['7 TONY','8 MATIAS','9 RAUL','10 HERNAN','11 MICHELLE','12 LUCIANO','13 VICENTE','2 PROVEEDOR','3 FABRICA'];
const MUEBLES=['CÓMODAS','MESAS','MUEBLES DE TV','MESAS DE LUZ','ESCRITORIOS','APARADORES','MESAS RATONAS','BIBLIOTECAS','PLACARD','MODULARES','SILLAS','VAJILLEROS','CAMAS','RESPALDOS','BOTINEROS','COMEDOR','CHIFONIER','ESTANTE FLOTANTE'];
const COL_COSTO={'SIN COSTO':'#15803d','COSTO BAJO':'#65a30d','COSTO MEDIO':'#b45309','COSTO ALTO':'#c0362c','DEVOLUCION':'#6d28d9'};

// Íconos SVG (sin emojis)
const ICO={

// Gráfico de dona (distribución por estado)
function donut(segments){
  const total=segments.reduce((a,s)=>a+s.n,0);
  const C=2*Math.PI*54,cx=70,cy=70;let off=0;
  const arcs=total?segments.filter(s=>s.n>0).map(s=>{const len=C*(s.n/total);const el=`<circle cx="${cx}" cy="${cy}" r="54" fill="none" stroke="${s.color}" stroke-width="17" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;off+=len;return el;}).join(''):'';
  return `<div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0"><circle cx="70" cy="70" r="54" fill="none" stroke="#eef1f6" stroke-width="17"></circle>${arcs}<text x="70" y="66" text-anchor="middle" font-size="27" font-weight="700" fill="#0f1a2a">${total}</text><text x="70" y="85" text-anchor="middle" font-size="11" fill="#8a94a3">reclamos</text></svg><div style="display:flex;flex-direction:column;gap:11px;flex:1;min-width:150px">${segments.map(s=>`<div style="display:flex;align-items:center;gap:10px;font-size:13.5px"><span style="width:9px;height:9px;border-radius:50%;background:${s.color};flex-shrink:0"></span><span style="flex:1;color:#2a3648;font-weight:500">${s.label}</span><span style="font-weight:700;color:#0f1a2a;font-variant-numeric:tabular-nums">${s.n}</span></div>`).join('')}</div></div>`;
}

const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function parseFecha(iso){if(!iso)return null;const a=iso.split('-').map(Number);if(!a[0]||!a[1]||!a[2])return null;return new Date(a[0],a[1]-1,a[2])}
function dosD(n){return String(n).padStart(2,'0')}
function formatFecha(iso){const d=parseFecha(iso);return d?dosD(d.getDate())+'/'+dosD(d.getMonth()+1)+'/'+d.getFullYear():'—'}
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+dosD(d.getMonth()+1)+'-'+dosD(d.getDate())}
function claveMes(iso){return iso?iso.slice(0,7):''}
function nombreMes(c){if(!c)return'';const a=c.split('-').map(Number);return MESES[a[1]-1]+' '+a[0]}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function abierto(r){return r.estado!=='CERRADO'}
function countBy(arr,fn){const m=new Map();for(const r of arr){let v=fn(r);if(v==null||String(v).trim()==='')continue;v=String(v).trim();m.set(v,(m.get(v)||0)+1)}return [...m.entries()].map(([label,n])=>({label,n})).sort((a,b)=>b.n-a.n)}
function nextNum(){let m=0;for(const r of state.reclamos){const n=+r.num||0;if(n>m)m=n}return m+1}
async function asignarNumerosFaltantes(){
  const sinNum=state.reclamos.filter(r=>!(+r.num>0));
  if(!sinNum.length)return;
  let max=state.reclamos.reduce((a,r)=>Math.max(a,+r.num||0),0);
  sinNum.sort((a,b)=>{const fa=a.fechaReclamo||'',fb=b.fechaReclamo||'';return fa<fb?-1:fa>fb?1:(a.id<b.id?-1:1)});
  for(const r of sinNum)r.num=++max;
  write(K_REC,state.reclamos);
  try{await supaUpsertMany(sinNum,null)}catch(e){avisoError(e)}
}

    <td>${esc(r.orden)||'—'}</td>
    <td>${esc(r.mueble)||'—'}</td>
    <td class="txt-clip" title="${esc(r.problema)}" style="color:var(--muted)">${esc(r.problema)||'—'}</td></tr>`).join('');
  const selEstado=state._fEstado==='__SINCERRAR__'?'<option value="__SINCERRAR__" selected>Sin cerrar</option>':'<option value="__SINCERRAR__">Sin cerrar</option>';
  view.innerHTML=`<div class="card"><div class="section-title"><h2>Reclamos</h2><span class="muted">${fil.length} de ${state.reclamos.length}</span></div>
    <div class="filters" style="margin-bottom:16px">
      <label class="field" style="min-width:210px">Buscar<input id="lq" value="${esc(state._q)}" placeholder="Nombre, orden, mueble, problema…"></label>
      <label class="field">Estado<select id="lEstado"><option value="">Todos</option>${selEstado}${opts(ESTADOS,state._fEstado)}</select></label>
      <label class="field">Mes<select id="lMes"><option value="">Todos</option>${meses.map(m=>`<option value="${m}" ${state._fMes===m?'selected':''}>${nombreMes(m)}</option>`).join('')}</select></label>
    </div>
    ${fil.length===0?`<div class="empty"><div class="big">${ICO.empty}</div>${state.reclamos.length===0?'Todavía no cargaste reclamos.':'No hay reclamos con esos filtros.'}</div>`:
    `<div class="table-wrap"><table class="compact"><thead><tr><th></th><th>N°</th><th>Estado</th><th>Fecha</th><th>Cliente</th><th>Orden</th><th>Mueble</th><th>Problema</th></tr></thead><tbody>${rows}</tbody></table></div>`}
  </div>`;
  const lq=$('lq');lq.oninput=()=>{state._q=lq.value;const p=lq.selectionStart;vistaLista();const n=$('lq');n.focus();n.setSelectionRange(p,p)};
  $('lEstado').onchange=e=>{state._fEstado=e.target.value;vistaLista()};
  $('lMes').onchange=e=>{state._fMes=e.target.value;vistaLista()};
  view.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{state.editando=state.reclamos.find(x=>x.id===b.dataset.ed);state.tab='cargar';render()});
  view.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>mostrarComprobante(state.reclamos.find(x=>x.id===b.dataset.print)));
  view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const r=state.reclamos.find(x=>x.id===b.dataset.del);if(confirm('¿Borrar el reclamo de '+(r.nombre||r.orden||'')+'?')){setReclamos(state.reclamos.filter(x=>x.id!==b.dataset.del));supaDeleteReclamo(b.dataset.del).catch(avisoError);vistaLista()}});
}

// ---------- Tablero ----------
function bars(items,color){
  if(!items.length)return '<p class="muted">Sin datos todavía.</p>';
  const max=Math.max(...items.map(i=>i.n));
  const inner='<div class="bars">'+items.map(i=>{const c=typeof color==='function'?color(i.label):color;
    return `<div class="bar-row"><span class="bar-lbl" title="${esc(i.label)}">${esc(i.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(i.n/max*100)}%;background:${c}"></div></div><span class="n">${i.n}</span></div>`}).join('')+'</div>';
  return items.length>12?`<div class="bars-scroll">${inner}</div>`:inner;
}
function trendSVG(items){
  if(!items.length)return '<p class="muted">Sin datos todavía.</p>';
  const W=720,H=220,pl=30,pb=34,pt=10,pr=10;const iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(1,...items.map(i=>i.n));const n=items.length;const step=iw/n;const bw=Math.min(46,step*0.6);
  const yy=v=>pt+ih*(1-v/max);
  let bars='';
  items.forEach((p,i)=>{const cx=pl+step*i+step/2;const h=ih*p.n/max;
    bars+=`<rect x="${cx-bw/2}" y="${pt+ih-h}" width="${bw}" height="${h}" rx="4" fill="#2f6fed"/>`;
    bars+=`<text x="${cx}" y="${pt+ih-h-4}" text-anchor="middle" font-size="11" fill="#0f1a2a" font-weight="700">${p.n}</text>`;
    bars+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="10" fill="#8a94a3">${esc(p.label)}</text>`;});
  const grid=[0,.5,1].map(f=>{const v=Math.round(max*f);return `<line x1="${pl}" y1="${yy(v)}" x2="${W-pr}" y2="${yy(v)}" stroke="#eef1f5"/><text x="${pl-4}" y="${yy(v)+4}" text-anchor="end" font-size="10" fill="#9aa4b2">${v}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%">${grid}${bars}</svg>`;
}
function vistaTablero(){
  const R=state.reclamos;
  if(R.length===0){view.innerHTML=`<div class="card"><div class="empty"><div class="big">${ICO.empty}</div>Cargá tu primer reclamo y acá vas a ver el seguimiento por estado y las estadísticas (flete, mueble, proveedor, costos y tendencia).</div></div>`;return}
  const fil=R.filter(r=>!state._fMes||claveMes(r.fechaReclamo)===state._fMes);
  const cont=e=>fil.filter(r=>r.estado===e).length;
  const abiertos=fil.filter(abierto).length, cerrados=cont('CERRADO');
  const pctCerr=fil.length?Math.round(cerrados/fil.length*100):0;
  const montos=fil.map(r=>+r.costoMonto||0).reduce((a,b)=>a+b,0);
  const meses=[...new Set(R.map(r=>claveMes(r.fechaReclamo)).filter(Boolean))].sort().reverse();
  // tendencia por mes (cronológica, últimos 12)
  const porMes=countBy(R,r=>claveMes(r.fechaReclamo)).sort((a,b)=>a.label<b.label?-1:1).slice(-12).map(i=>({label:nombreMes(i.label).split(' ')[0].slice(0,3),n:i.n}));
  view.innerHTML=`<div class="card"><div class="section-title"><h2>Resumen del período</h2>
    <select id="tbMes" style="width:auto"><option value="">Todos los meses</option>${meses.map(m=>`<option value="${m}" ${state._fMes===m?'selected':''}>${nombreMes(m)}</option>`).join('')}</select></div>
    <p class="muted" style="margin:0 0 14px">Tocá una tarjeta para ver esos reclamos en el listado.</p>
    <div class="grid grid-stats">
      <div class="stat s-abierto clickable" data-go="ABIERTO"><div class="label"><span class="dot"></span>Abiertos</div><div class="value">${cont('ABIERTO')}</div></div>
      <div class="stat s-espera clickable" data-go="EN ESPERA"><div class="label"><span class="dot"></span>En espera</div><div class="value">${cont('EN ESPERA')}</div></div>
      <div class="stat s-prod clickable" data-go="EN PRODUCCIÓN"><div class="label"><span class="dot"></span>En producción</div><div class="value">${cont('EN PRODUCCIÓN')}</div></div>
      <div class="stat s-abierto clickable" data-go="__SINCERRAR__"><div class="label"><span class="dot"></span>Sin cerrar</div><div class="value">${abiertos}</div></div>
      <div class="stat s-cerrado clickable" data-go="CERRADO"><div class="label"><span class="dot"></span>Cerrados</div><div class="value">${cerrados}<small> (${pctCerr}%)</small></div></div>
      <div class="stat clickable" data-go=""><div class="label"><span class="dot"></span>Total reclamos</div><div class="value">${fil.length}</div></div>
      ${montos>0?`<div class="stat"><div class="label"><span class="dot"></span>Costo total</div><div class="value">$${montos.toLocaleString('es-AR')}</div></div>`:''}
    </div></div>
    <div class="charts-2">
      <div class="card"><h3>Distribución por estado</h3>${donut([{label:'Abiertos',n:cont('ABIERTO'),color:'#c0362c'},{label:'En espera',n:cont('EN ESPERA'),color:'#b45309'},{label:'En producción',n:cont('EN PRODUCCIÓN'),color:'#2f6fed'},{label:'Cerrados',n:cerrados,color:'#15803d'}])}</div>
      <div class="card"><h3>Reclamos por mes</h3>${trendSVG(porMes)}</div>
    </div>
    <div class="charts-2">
      <div class="card"><h3>Reclamos por flete / chofer</h3>${bars(countBy(fil,r=>r.flete),'#2f6fed')}</div>
      <div class="card"><h3>Reclamos por mueble</h3>${bars(countBy(fil,r=>r.mueble),'#0ea5e9')}</div>
      <div class="card"><h3>Reclamos por proveedor</h3>${bars(countBy(fil,r=>r.proveedor),'#0f766e')}</div>
      <div class="card"><h3>Responsable del problema</h3>${bars(countBy(fil,r=>r.respProblema),'#6366f1')}</div>
      <div class="card"><h3>Tipo de solución</h3>${bars(countBy(fil,r=>r.tipoSolucion),'#1e5fce')}</div>
      <div class="card"><h3>Costo de las soluciones</h3>${bars(countBy(fil,r=>r.costoCat),l=>COL_COSTO[l]||'#8a94a3')}</div>
    </div>`;
  $('tbMes').onchange=e=>{state._fMes=e.target.value;vistaTablero()};
  view.querySelectorAll('.stat.clickable').forEach(c=>c.onclick=()=>{state._fEstado=c.getAttribute('data-go');state._q='';state.tab='lista';render()});
}

// ---------- Configuración ----------
function vistaConfig(){
  const grupos=[
    ['muebles','Muebles'],['fletes','Fletes / Choferes'],['proveedores','Proveedores'],
    ['responsables','Responsables (problema y solución)'],['tiposSolucion','Tipos de solución'],['costos','Costos'],
  ];
  view.innerHTML=`<div class="card"><h2>Configuración</h2>
    <p class="muted">Editá las opciones que aparecen en los desplegables al cargar un reclamo. Tocá borrar para eliminar, editar para renombrar, o escribí abajo para agregar. Los cambios se guardan solos.</p>
    <p class="muted">Los <strong>estados</strong> (Abierto / En espera / En producción / Cerrado) son fijos porque mueven los colores y el tablero.</p></div>`
  + grupos.map(([k,t])=>`<div class="card"><h3 style="color:var(--ink);font-size:15px;font-weight:700;text-transform:none;letter-spacing:0">${t} <span class="muted" style="font-weight:500">(${state.config[k].length})</span></h3>
      <div class="cfg-list">${state.config[k].length? state.config[k].map((v,i)=>`<div class="cfg-item"><span>${esc(v)}</span><span class="cfg-acts"><button class="act-btn" title="Renombrar" data-ren="${k}|${i}">${ICO.edit}</button><button class="act-btn danger" title="Borrar" data-del="${k}|${i}">${ICO.del}</button></span></div>`).join(''):'<span class="muted">Sin opciones todavía.</span>'}</div>
      <div class="row-actions" style="margin-top:12px"><input id="new_${k}" placeholder="Agregar nueva opción…" style="max-width:320px"><button class="btn btn-primary btn-sm" data-add="${k}">Agregar</button></div>
    </div>`).join('');
  view.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add;const inp=$('new_'+k);const val=inp.value.trim();if(!val)return;
    if(state.config[k].some(x=>x.toLowerCase()===val.toLowerCase())){alert('Esa opción ya existe.');return}
    const c={...state.config};c[k]=[...c[k],val];setConfig(c);supaUpsertConfig(c).catch(avisoError);vistaConfig()});
  view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.del.split('|');if(!confirm('¿Borrar "'+state.config[k][+i]+'" de la lista?'))return;const c={...state.config};c[k]=c[k].filter((_,idx)=>idx!==+i);setConfig(c);supaUpsertConfig(c).catch(avisoError);vistaConfig()});
  view.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.ren.split('|');const cur=state.config[k][+i];const nv=(prompt('Editar opción:',cur)||'').trim();if(!nv||nv===cur)return;const c={...state.config};c[k]=c[k].map((x,idx)=>idx===+i?nv:x);setConfig(c);supaUpsertConfig(c).catch(avisoError);vistaConfig()});
}

// ---------- Comprobante imprimible ----------
function comprobanteHTML(r){
  const cell=(k,v)=>`<div class="doc-cell"><div class="k">${k}</div><div class="v">${esc(v)||'—'}</div></div>`;
  const costo=r.costoCat?(esc(r.costoCat)+((r.costoMonto!==''&&r.costoMonto!=null)?(' · $'+Number(r.costoMonto).toLocaleString('es-AR')):'')):'';
  return `<div class="doc">
    <div class="doc-head"><div class="doc-brand"><div class="logo-tile">BH</div><div>Belgrano Home<small>ENVÍOS</small></div></div>
      <div class="doc-note">Uso interno<br>Documento no válido como factura</div></div>
    <div class="doc-title">R E C L A M O</div>
    <div class="doc-sub">N° de reclamo <b>${r.num?'#'+r.num:'—'}</b> · Estado: <b>${esc(r.estado)}</b></div>
    <div class="doc-grid2">
      ${cell('Fecha del reclamo',formatFecha(r.fechaReclamo))}
      ${cell('N° de orden',r.orden)}
      ${cell('Cliente',r.nombre)}
      ${cell('Celular',r.celular)}
      ${cell('Producto / Mueble',r.mueble)}
      ${cell('Fecha de entrega',r.fechaEntrega?formatFecha(r.fechaEntrega):'')}
      ${cell('Chofer / Flete',r.flete)}
      ${cell('Proveedor',r.proveedor)}
    </div>
    <div class="doc-sec"><h3>DETALLES DEL PROBLEMA</h3><div class="doc-box">${esc(r.problema)||'—'}</div></div>
    <div class="doc-sec"><h3>RESOLUCIÓN</h3><div class="doc-grid2">
      ${cell('Responsable del problema',r.respProblema)}
      ${cell('Tipo de solución',r.tipoSolucion)}
      ${cell('Responsable de la solución',r.respSolucion)}
      ${cell('Costo de la solución',costo)}
    </div></div>
    ${r.observaciones?`<div class="doc-sec"><h3>OBSERVACIONES</h3><div class="doc-box">${esc(r.observaciones)}</div></div>`:''}
    <div class="doc-firmas"><div class="doc-firma">Firma cliente</div><div class="doc-firma">Firma responsable</div></div>
  </div>`;
}
function mostrarComprobante(r){
  if(!r)return;
  let o=document.getElementById('compOverlay');if(!o){o=document.createElement('div');o.id='compOverlay';document.body.appendChild(o)}
  o.innerHTML=`<div class="comp-sheet"><div class="comp-toolbar no-print">
    <button class="btn btn-primary btn-sm" id="comp_print">Imprimir / Guardar PDF</button>
    <button class="btn btn-ghost btn-sm" id="comp_close">Cerrar</button></div>${comprobanteHTML(r)}</div>`;
  o.style.display='block';
  document.getElementById('comp_print').onclick=()=>window.print();
  document.getElementById('comp_close').onclick=()=>{o.style.display='none'};
}

// ---------- Backup ----------
$('btnNuevo').onclick=()=>{state.editando=null;state.tab='cargar';toggleDrawer(false);render()};
$('btnMenu').onclick=()=>toggleDrawer();
$('backdrop').onclick=()=>toggleDrawer(false);
$('btnBackup').onclick=()=>{const data={app:'reclamos',version:2,exportadoEn:new Date().toISOString(),reclamos:state.reclamos,config:state.config};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='backup-reclamos-'+hoyISO()+'.json';a.click();URL.revokeObjectURL(url)};
$('btnImport').onclick=()=>$('fileImport').click();
$('fileImport').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Esto sube los reclamos del archivo a la nube (se combinan con los que ya haya). ¿Continuar?'))return;
    if(Array.isArray(d.reclamos))setReclamos(d.reclamos);if(d.config&&typeof d.config==='object')setConfig(d.config);render();
    banner('<span class="spin"></span> Subiendo a la nube…','load');
    supaUpsertMany(state.reclamos,state.config).then(()=>banner('Datos subidos a la nube','ok')).catch(avisoError);}
    catch(e){alert('No pude leer el archivo. ¿Es un archivo de backup válido?')}};
  r.readAsText(f);ev.target.value=''};
$('btnLogout').onclick=async()=>{try{await db.auth.signOut()}catch(e){}location.reload()};

start();
</script>
